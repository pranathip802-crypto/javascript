<!DOCTYPE html>
<html>
<head>
    <title>Bus Ticket Booking</title>
</head>
<body>

<h2>Bus Ticket Booking</h2>

Enter Age:
<input type="number" id="age"><br><br>

<button onclick="ticket()">Book Ticket</button>

<h3 id="result"></h3>

<script>
function ticket() {
    let age = Number(document.getElementById("age").value);

    if (age < 5) {
        result.innerHTML = "Ticket Price = FREE";
    }
    else if (age <= 12) {
        result.innerHTML = "Ticket Price = ₹100";
    }
    else if (age < 60) {
        result.innerHTML = "Ticket Price = ₹300";
    }
    else {
        result.innerHTML = "Ticket Price = ₹150";
    }
}
</script>

</body>
</html>
