<!DOCTYPE html>
<html>
<head>
    <title>Function Expression</title>
</head>

<body>

    <h1>Function Expression Example</h1>

    <button onclick="showMessage()">Click Me</button>

    <script>

        // Function Expression
        let greet = function() {
            alert("Hello Students");
        };

        function showMessage() {
            greet();
        }

    </script>

</body>
</html>
