<!DOCTYPE html>
<html>
<head>
    <title>Function Calling</title>
</head>

<body>

    <h1>JavaScript Function Calling</h1>

    <button onclick="sayHello()">Click Me</button>

    <script>

        // Function creation
        function sayHello() {
            alert("Hello");
        }

    </script>

</body>
</html>
