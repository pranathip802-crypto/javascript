<!DOCTYPE html>
<html>
<head>
    <title>Parameters Without Return</title>
</head>

<body>

    <h1>Function with Parameters</h1>

    <button onclick="calculate()">Calculate</button>

    <script>

        // Function with parameters but no return
        function add(a, b) {
            alert("Sum = " + (a + b));
        }

        function calculate() {
            add(10, 20);
        }

    </script>

</body>
</html>
