<!DOCTYPE html>
<html>
<head>
    <title>Function Declaration</title>
</head>

<body>

    <h1>Function Declaration Example</h1>

    <button onclick="add()">Calculate</button>

    <script>

        // Function Declaration
        function add() {
            let a = 10;
            let b = 20;

            alert("Sum = " + (a + b));
        }

    </script>

</body>
</html>
