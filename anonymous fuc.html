<!DOCTYPE html>
<html>
<head>
    <title>Anonymous Function</title>
</head>

<body>

    <h1>Anonymous Function Example</h1>

    <button onclick="showMessage()">Click Me</button>

    <script>

        // Anonymous Function
        let message = function() {
            alert("Hello Students");
        };

        function showMessage() {
            message();
        }

    </script>

</body>
</html>
