<!DOCTYPE html>
<html>
<head>
    <title>Recursive Function</title>
</head>

<body>

    <h1>Recursive Function Example</h1>

    <button onclick="startCount()">Start Counting</button>

    <script>

        // Recursive function
        function count(n) {

            // Stop condition
            if (n === 0) {
                return;
            }

            alert(n);

            // Function calls itself
            count(n - 1);
        }

        function startCount() {
            count(5);
        }

    </script>

</body>
</html>
