<!DOCTYPE html>
<html>
<head>
    <title>Parameters and Return</title>
</head>

<body>

    <h1>Function with Parameters and Return</h1>

    <button onclick="calculate()">Calculate</button>

    <script>

        // Function with parameters and return
        function add(a, b) {
            return a + b;
        }

        function calculate() {

            let x = add(10, 20);

            alert("Sum = " + x);

        }

    </script>

</body>
</html>
