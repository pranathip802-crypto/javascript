<!DOCTYPE html>
<html>
<head>
    <title>Largest of Two Numbers</title>
</head>
<body>

<h2>Largest of Two Numbers</h2>

<input type="number" id="num1" placeholder="First Number"><br><br>
<input type="number" id="num2" placeholder="Second Number"><br><br>

<button onclick="largest()">Find Largest</button>

<h3 id="result"></h3>

<script>
function largest() {
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    if (a > b)
        document.getElementById("result").innerHTML = a + " is Largest";
    else if (b > a)
        document.getElementById("result").innerHTML = b + " is Largest";
    else
        document.getElementById("result").innerHTML = "Both are Equal";
}
</script>

</body>
</html>
