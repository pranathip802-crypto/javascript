<!DOCTYPE html>
<html>
<head>
    <title>Rest Parameters</title>
</head>

<body>

    <h1>Rest Parameters Example</h1>

    <button onclick="calculateSum()">Calculate Sum</button>

    <script>

        // Rest parameter
        function add(...numbers) {

            let total = 0;

            for (let number of numbers) {
                total += number;
            }

            return total;
        }

        function calculateSum() {

            let result1 = add(10, 20);
            let result2 = add(10, 20, 30);
            let result3 = add(10, 20, 30, 40);

            alert(
                "10 + 20 = " + result1 +
                "\n10 + 20 + 30 = " + result2 +
                "\n10 + 20 + 30 + 40 = " + result3
            );

        }

    </script>

</body>
</html>
