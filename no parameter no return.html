<!DOCTYPE html>
<html>
<head>
    <title>No Parameter and No Return</title>
</head>

<body>

    <h1>Function Example</h1>

    <button onclick="message()">Click Me</button>

    <script>

        // No parameter and no return
        function message() {
            alert("Welcome to JavaScript!");
        }

    </script>

</body>
</html>
