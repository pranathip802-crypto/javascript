<!DOCTYPE html>
<html>
<head>
    <title>Function Expression with Parameters</title>
</head>

<body>

    <h1>Function Expression with Parameters</h1>

    <button onclick="calculate()">Calculate</button>

    <script>

        // Function Expression
        let add = function(a, b) {
            return a + b;
        };

        function calculate() {

            let result = add(10, 20);

            alert("Sum = " + result);

        }

    </script>

</body>
</html>
