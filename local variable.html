<!DOCTYPE html>
<html>
<head>
    <title>Local Variable</title>
</head>

<body>

    <h1>Local Variable Example</h1>

    <button onclick="showStudent()">Show Student</button>

    <script>

        function student() {

            // Local variable
            let name = "Ravi";

            alert("Student Name: " + name);
        }

        function showStudent() {
            student();
        }

    </script>

</body>
</html>
