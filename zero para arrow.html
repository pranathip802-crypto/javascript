<!DOCTYPE html>
<html>
<head>
    <title>Zero Parameter Arrow Function</title>
</head>

<body>

    <h1>Zero Parameter Arrow Function</h1>

    <button onclick="showMessage()">Click Me</button>

    <script>

        // Arrow function with zero parameters
        const greet = () => {
            alert("Hello Students");
        };

        function showMessage() {
            greet();
        }

    </script>

</body>
</html>
