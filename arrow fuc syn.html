<!DOCTYPE html>
<html>
<head>
    <title>Arrow Function Short Syntax</title>
</head>

<body>

    <h1>Arrow Function - Short Syntax</h1>

    <button onclick="calculate()">Calculate</button>

    <script>

        // Arrow function with short syntax
        const add = (a, b) => a + b;

        function calculate() {

            let result = add(10, 20);

            alert("Sum = " + result);

        }

    </script>

</body>
</html>
