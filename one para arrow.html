<!DOCTYPE html>
<html>
<head>
    <title>One Parameter Arrow Function</title>
</head>

<body>

    <h1>One Parameter Arrow Function</h1>

    <button onclick="calculateSquare()">Calculate Square</button>

    <script>

        // Arrow function with one parameter
        const square = n => n * n;

        function calculateSquare() {

            let result = square(5);

            alert("Square of 5 = " + result);

        }

    </script>

</body>
</html>
