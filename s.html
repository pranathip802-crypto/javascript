<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n=prompt("Enter a Value:");
        if(n % 5 == 0){
            alert("Given number is divisible by 5")
        }
        else{
            alert("Given number not divisible by 5");
        }
    </script>
</body>
</html>
