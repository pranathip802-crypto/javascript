<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd</title>
</head>
<body>
    <script>
        let num = prompt("Enter a value:");
        
        if (num % 2 == 0) {
            alert("Even number");
        } else {
            alert("Odd Number");
        }
    </script>
</body>
</html>
