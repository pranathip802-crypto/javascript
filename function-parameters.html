<!DOCTYPE html>
<html>
<head>
    <title>Function Parameters</title>
</head>

<body>

    <h1>Function Parameters Example</h1>

    <button onclick="greetUser()">Click Me</button>

    <script>

        // name is the parameter
        function greet(name) {
            alert("Hello " + name);
        }

        function greetUser() {

            // "Ravi" is the argument
            greet("Ravi");

        }

    </script>

</body>
</html>
