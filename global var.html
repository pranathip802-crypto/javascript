<!DOCTYPE html>
<html>
<head>
    <title>Global Variable</title>
</head>

<body>

    <h1>Global Variable Example</h1>

    <button onclick="display()">Display College</button>

    <script>

        // Global variable
        let college = "ABC College";

        function display() {

            // Accessing global variable
            alert("College: " + college);

        }

    </script>

</body>
</html>
