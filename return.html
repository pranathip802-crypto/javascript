<!DOCTYPE html>
<html>
<head>
    <title>Return Statement</title>
</head>

<body>

    <h1>Return Statement Example</h1>

    <button onclick="calculateSum()">Calculate Sum</button>

    <script>

        // Function with return
        function add(a, b) {
            return a + b;
        }

        function calculateSum() {

            let result = add(10, 20);

            alert("Sum = " + result);

        }

    </script>

</body>
</html>
