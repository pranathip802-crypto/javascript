<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = Number(prompt("Enter First Value:"));
        let b = Number(prompt("Enter second value:"));
        let c = Number(prompt("Enter third value:"));

        if(a >= b && a >= c){
            alert("A value is large");
        }
        else if(b >= a && b >= c){
            alert("B value is large");
        }
        else if(c >= a && c >= b){
            alert("C value is large");
        }
        else{
            alert("Invalid Character");
        }
    </script>
</body>
</html>
