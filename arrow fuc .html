<!DOCTYPE html>
<html>
<head>
    <title>Arrow Function</title>
</head>

<body>

    <h1>Arrow Function Example</h1>

    <button onclick="calculate()">Calculate</button>

    <script>

        // Arrow Function
        const add = (a, b) => {
            return a + b;
        };

        function calculate() {

            let result = add(10, 20);

            alert("Sum = " + result);

        }

    </script>

</body>
</html>
